openapi: 3.0.3
info:
  title: TaskFlow REST API
  version: 1.0.0
  description: 'Полная спецификация REST API учебного трекера задач TaskFlow. Все защищённые маршруты требуют access
    JWT в заголовке Authorization: Bearer <token>. Успешные ответы обёрнуты в объект data; ошибки имеют формат {error:{code,message}}.'
servers:
- url: /api/v1
  description: API через основной web-сервер
tags:
- name: Health
  description: Проверка доступности сервиса
- name: Auth
  description: Регистрация, вход, токены и выход
- name: Users
  description: Профиль текущего пользователя
- name: Projects
  description: Проекты и их участники
- name: Tasks
  description: Задачи, фильтры и история
- name: Comments
  description: Комментарии к задачам
- name: Sprints
  description: Спринты проекта
- name: Attachments
  description: Вложения задач
- name: Dashboard
  description: Сводная статистика
- name: Admin
  description: Администрирование пользователей
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access-токен, возвращаемый при входе или обновлении токена.
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Идентификатор проекта
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Идентификатор задачи
    SprintId:
      name: sprintId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Идентификатор спринта
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Идентификатор пользователя
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum:
          - admin
          - lead
          - participant
          - teacher
        is_blocked:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        owner_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Member:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - lead
          - participant
          - teacher
          - admin
    Task:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        sprint_id:
          type: integer
          nullable: true
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - backlog
          - todo
          - in_progress
          - review
          - done
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
        assignee_id:
          type: integer
          nullable: true
        creator_id:
          type: integer
        due_date:
          type: string
          format: date-time
          nullable: true
        attachment_path:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Sprint:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        name:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        is_closed:
          type: boolean
        created_at:
          type: string
          format: date-time
    Comment:
      type: object
      properties:
        id:
          type: integer
        task_id:
          type: integer
        user_id:
          type: integer
        user_name:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time
    TaskHistory:
      type: object
      properties:
        id:
          type: integer
        task_id:
          type: integer
        actor_id:
          type: integer
        field:
          type: string
        old_value:
          type: string
        new_value:
          type: string
        created_at:
          type: string
          format: date-time
    ProjectHistory:
      allOf:
      - $ref: '#/components/schemas/TaskHistory'
      - type: object
        properties:
          task_title:
            type: string
          actor_name:
            type: string
    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        pages:
          type: integer
    AuthTokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    Dashboard:
      type: object
      properties:
        total_tasks:
          type: integer
        completed_tasks:
          type: integer
        overdue_tasks:
          type: integer
        completion_percent:
          type: number
        by_status:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              count:
                type: integer
    UploadResult:
      type: object
      properties:
        path:
          type: string
        filename:
          type: string
    BooleanResult:
      type: object
      properties:
        deleted:
          type: boolean
        updated:
          type: boolean
        changed:
          type: boolean
        logged_out:
          type: boolean
    OK:
      type: object
      properties:
        data: {}
paths:
  /health:
    get:
      tags:
      - Health
      summary: Проверить доступность API
      operationId: healthCheck
      responses:
        '200':
          description: API доступен
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '400':
          description: Ошибка валидации запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется действительный access JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав или нет доступа к ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /auth/register:
    post:
      tags:
      - Auth
      summary: Зарегистрировать пользователя
      operationId: register
      responses:
        '200':
          description: Пользователь создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                      name:
                        type: string
                      role:
                        type: string
        '400':
          description: Ошибка валидации или некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется действительный access JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав или нет доступа к ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - name
              - password
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                password:
                  type: string
                  minLength: 8
      security: []
  /auth/login:
    post:
      tags:
      - Auth
      summary: Войти и получить пару JWT
      operationId: login
      responses:
        '200':
          description: Токены выданы
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Неверные учётные данные или аккаунт заблокирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Ошибка валидации запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав или нет доступа к ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      security: []
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Обновить access и refresh токены
      operationId: refreshTokens
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      refresh_token:
                        type: string
        '401':
          description: Токен недействителен, отозван или истёк
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Ошибка валидации запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав или нет доступа к ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
      security: []
  /auth/forgot-password:
    post:
      tags:
      - Auth
      summary: Запросить сброс пароля
      operationId: forgotPassword
      responses:
        '200':
          description: Если аккаунт существует, ссылка записана в лог сервера
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
        '400':
          description: Ошибка валидации запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется действительный access JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав или нет доступа к ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      security: []
  /auth/reset-password:
    post:
      tags:
      - Auth
      summary: Установить новый пароль по токену сброса
      operationId: resetPassword
      responses:
        '200':
          description: Пароль изменён
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      changed:
                        type: boolean
        '400':
          description: Ошибка валидации запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется действительный access JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав или нет доступа к ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      security: []
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Выйти и отозвать refresh-токен
      operationId: logout
      responses:
        '200':
          description: Сессия завершена
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      logged_out:
                        type: boolean
        '400':
          description: Ошибка валидации запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется действительный access JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав или нет доступа к ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      security:
      - bearerAuth: []
  /users/me:
    get:
      tags:
      - Users
      summary: Получить профиль текущего пользователя
      operationId: getMe
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Ошибка валидации запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется действительный access JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав или нет доступа к ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
    patch:
      tags:
      - Users
      summary: Изменить имя текущего пользователя
      operationId: updateMe
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Ошибка валидации запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется действительный access JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав или нет доступа к ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
      security:
      - bearerAuth: []
  /users/me/password:
    post:
      tags:
      - Users
      summary: Изменить пароль текущего пользователя
      operationId: changePassword
      responses:
        '200':
          description: Пароль изменён
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      changed:
                        type: boolean
        '400':
          description: Ошибка валидации запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется действительный access JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав или нет доступа к ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              - new_password
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      security:
      - bearerAuth: []
  /projects:
    get:
      tags:
      - Projects
      summary: Получить доступные пользователю проекты
      operationId: listProjects
      responses:
        '200':
          description: Список проектов
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
        '400':
          description: Ошибка валидации запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется действительный access JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав или нет доступа к ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: search
        in: query
        schema:
          type: string
        description: Поиск по названию проекта
      security:
      - bearerAuth: []
    post:
      tags:
      - Projects
      summary: Создать проект
      operationId: createProject
      responses:
        '200':
          description: Созданный проект
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '400':
          description: Ошибка валидации запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется действительный access JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав или нет доступа к ресурсу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                description:
                  type: string
      security:
      - bearerAuth: []
  /projects/{id}:
    get:
      tags:
      - Projects
      summary: Получить проект
      operationId: getProject
      responses:
        '200':
          description: Проект
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        '400':
