services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
    ports:

      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow} -d ${POSTGRES_DB:-taskflow}"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://taskflow:change-this-db-password@db:5432/taskflow?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret-please-32chars}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      API_PORT: 8081
      SEED_DEMO: ${SEED_DEMO:-true}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    depends_on: [backend]
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [frontend, backend]
volumes:
  pgdata:
  uploads:
